<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зробити замовлення</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 12px;
      background: #fff;
    }

    h2 {
      text-align: center;
    }

    #categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .category {
      padding: 6px 12px;
      border-radius: 16px;
      background: #eee;
      white-space: nowrap;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }

    .category.active {
      background: #0088cc;
      color: #fff;
    }

    .product {
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .product img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-info {
      flex: 1;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0088cc;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
    }

    .controls input {
      width: 48px;
      text-align: center;
    }

    .cart-row {
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .cart-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .remove-btn {
      background: #f5f5f5;
      color: #d32f2f;
      border: 1px solid #d32f2f;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      white-space: nowrap;
    }

    #go-cart {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      background: #0088cc;
      color: #fff;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      display: none;
      border: none;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    #submit {
      background: #0088cc;
      color: #fff;
    }

    #back {
      background: #eee;
    }
  </style>
</head>

<body>

  <h2>Зробити замовлення</h2>

  <div id="catalog-screen">
    <div id="categories"></div>
    <div id="products"></div>
  </div>

  <div id="product-screen" style="display:none">
    <div id="product-content"></div>
  </div>

  <div id="cart-screen" style="display:none">
    <div id="cart-items"></div>
    <button id="submit">Оформити замовлення</button>
    <button id="back">⬅️ Повернутись до каталогу</button>
  </div>

  <button id="go-cart"></button>

  <script src="app.js"></script>
</body>
</html>
