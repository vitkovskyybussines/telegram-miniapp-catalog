<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Зробити замовлення</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #fff;
    }

    h1 {
      text-align: center;
      margin: 16px 0;
    }

    .screen {
      animation: fadeSlide 0.25s ease;
      padding-bottom: 100px;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 12px 12px;
    }

    .tab {
      padding: 8px 14px;
      border-radius: 16px;
      background: #eee;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab.active {
      background: #2196f3;
      color: #fff;
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .product-info {
      cursor: pointer;
    }

    .product-info strong {
      display: block;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #2196f3;
      color: #fff;
      font-size: 18px;
    }

    .count {
      width: 36px;
      text-align: center;
    }

    .footer {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      background: #2196f3;
      color: #fff;
      padding: 14px;
      text-align: center;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .footer.hidden {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .delete {
      background: #f44336;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
    }

    textarea {
      width: calc(100% - 24px);
      margin: 12px;
      height: 80px;
    }

    .action {
      margin: 12px;
      padding: 14px;
      text-align: center;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      background: #2196f3;
      color: #fff;
    }

    .secondary {
      background: #eee;
    }

    img.product-img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <h1 id="title"></h1>
  <div id="content"></div>
  <div id="footer" class="footer hidden"></div>

  <script src="app.js"></script>
</body>
</html>
