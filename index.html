<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Зробити замовлення</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      padding: 16px;
      background: #fff;
      margin: 0;
      border-bottom: 1px solid #ddd;
    }

    .categories {
      display: flex;
      gap: 8px;
      padding: 12px;
      overflow-x: auto;
      background: #fff;
    }

    .category {
      padding: 8px 14px;
      border-radius: 12px;
      background: #eee;
      cursor: pointer;
      white-space: nowrap;
    }

    .category.active {
      background: #2196f3;
      color: #fff;
    }

    .product, .cart-item {
      background: #fff;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .product-row,
    .cart-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .product-info {
      flex: 1;
      cursor: pointer;
    }

    img.thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls button {
      height: 34px;
      min-width: 34px;
      border-radius: 8px;
      border: none;
      background: #2196f3;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .controls input {
      width: 60px;
      height: 34px;
      text-align: center;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .remove-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid #c62828;
      background: #ffeaea;
      color: #c62828;
      cursor: pointer;
      white-space: nowrap;
    }

    textarea {
      width: calc(100% - 24px);
      margin: 12px;
      height: 90px;
      font-size: 14px;
      border-radius: 8px;
    }

    .button {
      margin: 12px;
      padding: 14px;
      text-align: center;
      background: #2196f3;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .back {
      background: #ccc;
      color: #000;
    }

    .fade {
      animation: fade 0.2s ease;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

<body>
  <h1 id="title">Зробити замовлення</h1>

  <div id="categories" class="categories"></div>
  <div id="content"></div>

  <script src="app.js"></script>
</body>
</html>
