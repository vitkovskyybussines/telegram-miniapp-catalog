<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Зробити замовлення</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-main: #1e1e1e;
      --bg-card: #2a2a2a;
      --accent: #8b1d2c;
      --accent-dark: #6f1622;
      --text-main: #ffffff;
      --text-muted: #b0b0b0;
      --border: #3a3a3a;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 120px;
    }

    h1 {
      text-align: center;
      padding: 16px;
      margin: 0;
      border-bottom: 1px solid var(--border);
      font-size: 18px;
    }

    /* ---------- Categories ---------- */
    .categories {
      display: flex;
      gap: 8px;
      padding: 12px;
      overflow-x: auto;
      background: var(--bg-main);
    }

    .category {
      padding: 8px 16px;
      border-radius: 18px;
      background: #3a3a3a;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      font-size: 14px;
    }

    .category.active {
      background: var(--accent);
      color: #fff;
    }

    /* ---------- GRID ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
    }

    .product {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .product img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      cursor: pointer;
    }

    .product-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .product-body strong {
      font-size: 14px;
      cursor: pointer;
    }

    .product-body small {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* ---------- Controls ---------- */
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
    }

    .controls button {
      min-width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .controls button:active {
      background: var(--accent-dark);
    }

    .controls input {
      width: 40px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1a1a1a;
      color: #fff;
      text-align: center;
      font-size: 14px;
    }

    /* ---------- Footer ---------- */
    .footer {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      background: var(--accent);
      color: #fff;
      padding: 16px;
      text-align: center;
      border-radius: 16px;
      font-size: 16px;
      cursor: pointer;
      transform: translateY(120%);
      transition: transform 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .footer.show {
      transform: translateY(0);
    }

    /* ---------- Buttons ---------- */
    .button {
      margin: 12px;
      padding: 14px;
      text-align: center;
      background: var(--accent);
      color: #fff;
      border-radius: 14px;
      cursor: pointer;
      font-size: 15px;
    }

    .button.back {
      background: #3a3a3a;
    }
  </style>
</head>

<body>
  <h1 id="title">Зробити замовлення</h1>

  <div id="categories" class="categories"></div>

  <!-- ВАЖЛИВО: content тепер грід -->
  <div id="content" class="grid"></div>

  <div id="footer" class="footer"></div>

  <script src="app.js"></script>
</body>
</html>
