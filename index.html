<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Зробити замовлення</title>

  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 12px;
      background: #fff;
      color: #111;
    }

    h2 {
      text-align: center;
      margin-bottom: 12px;
    }

    /* Categories */
    #categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .category {
      padding: 6px 12px;
      border-radius: 16px;
      background: #eee;
      white-space: nowrap;
      cursor: pointer;
      font-size: 14px;
    }

    .category.active {
      background: #0088cc;
      color: #fff;
    }

    /* Products */
    #products {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product {
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }

    .product img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }

    .product-info {
      flex: 1;
      cursor: pointer;
    }

    .product-name {
      font-weight: 600;
    }

    .product-weight {
      font-size: 12px;
      color: #666;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: #0088cc;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .controls input {
      width: 48px;
      text-align: center;
      font-size: 14px;
    }

    /* Product screen */
    #product-screen img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    /* Cart */
    .cart-row {
      margin-bottom: 12px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    .cart-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    textarea {
      width: 100%;
      min-height: 60px;
      margin-top: 12px;
      padding: 8px;
      font-size: 14px;
    }

    /* Buttons */
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      margin-top: 8px;
      cursor: pointer;
    }

    #submit {
      background: #0088cc;
      color: #fff;
    }

    #back {
      background: #eee;
    }

    #go-cart {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      background: #0088cc;
      color: #fff;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      display: none;
    }
  </style>
</head>

<body>

  <h2>Зробити замовлення</h2>

  <!-- КАТАЛОГ -->
  <div id="catalog-screen">
    <div id="categories"></div>
    <div id="products"></div>
  </div>

  <!-- ТОВАР -->
  <div id="product-screen" style="display:none">
    <div id="product-content"></div>
  </div>

  <!-- КОШИК -->
  <div id="cart-screen" style="display:none">
    <div id="cart-items"></div>

    <textarea
      id="comment"
      placeholder="Коментар до замовлення (необов'язково)">
    </textarea>

    <button id="submit">Оформити замовлення</button>
    <button id="back">⬅️ Назад</button>
  </div>

  <!-- НИЖНЯ КНОПКА -->
  <button id="go-cart"></button>

  <script src="app.js"></script>
</body>
</html>
