<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Зробити замовлення</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
    }

    h1 {
      text-align: center;
      margin: 16px 0;
    }

    .screen {
      animation: fade 0.25s ease;
      padding-bottom: 40px;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .product {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .product img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }

    .product-info {
      flex: 1;
      cursor: pointer;
    }

    .button {
      margin: 12px;
      padding: 14px;
      background: #2196f3;
      color: #fff;
      text-align: center;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .button.secondary {
      background: #eeeeee;
      color: #000;
    }

    .product-img-large {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <h1 id="title"></h1>
  <div id="content"></div>

  <script src="app.js"></script>
</body>
</html>
